<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Retrieval practice for Evercore M&amp;A technicals.">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("evp-theme")||"light";if(t!=="system")document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<title>Evercore Prep Suite</title>
</head>
<body>
<div id="gate" hidden>
  <div class="gatebox">
    <h1>Evercore Prep</h1>
    <p class="mut2">The question bank is encrypted. Enter the passphrase to unlock it on this device.</p>
    <form id="gform" autocomplete="on">
      <label class="lbl2" for="gpass">Passphrase</label>
      <input type="password" id="gpass" name="password" autocomplete="current-password" spellcheck="false">
      <label class="ckrow" style="margin-top:var(--s3)">
        <input type="checkbox" id="gremember" checked>
        <span>Remember this device, so I only type this once</span>
      </label>
      <div class="row" style="margin-top:var(--s4)">
        <button class="b" id="gbtn" type="submit">Unlock</button>
        <span id="gmsg" class="mut"></span>
      </div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <nav id="side">
    <div class="brand">
      <h1>Evercore Prep</h1>
      <p id="brandsub">M&amp;A technicals</p>
    </div>
    <div class="lbl">Question bank</div>
    <button class="nav" data-bank="400">The 400<span class="ct" id="ct400"></span></button>
    <button class="nav" data-bank="full">Full bank<span class="ct" id="ctfull"></span></button>
    <div class="lbl">Practice</div>
    <button class="nav" data-view="session">Session<span class="ct" id="ctdue"></span></button>
    <button class="nav" data-view="mode-binary">Binary</button>
    <button class="nav" data-view="mode-card">Flashcards</button>
    <button class="nav" data-view="mode-def">Definitions</button>
    <button class="nav" data-view="mode-mc">Multiple choice</button>
    <button class="nav" data-view="mode-calc">Calc</button>
    <button class="nav" data-view="mode-grid">Three-statement</button>
    <button class="nav" data-view="mode-frq">Free response</button>
    <button class="nav" data-view="mode-spoken">Spoken check</button>
    <div class="lbl">Review</div>
    <button class="nav" data-view="read">Read the 400</button>
    <button class="nav" data-view="diagnostic">Diagnostic</button>
    <button class="nav" data-view="readiness">Readiness</button>
    <button class="nav" data-view="ledger">Error ledger</button>
    <button class="nav" data-view="settings">Settings</button>
  </nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<script src="grade.js"></script>
<script src="gate.js"></script>

</body>
</html>
